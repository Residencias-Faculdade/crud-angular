# COMPATIBILIDADE COM ATIVIDADENGX - Nginx para Micro Frontend
# ARQUIVO NOVO (antes nao existia). Espelha atividadengx/nginx.conf mas com extras para Web Component:
# - CORS * em .js para permitir shell :3000 buscar :4200/main.js cross-origin (shell loadScript usa fetch cross-origin)
# - /main.js no-cache para que a shell sempre pegue a versao nova (nao pode ser immutable com hash)
# - try_files SPA igual a shell para suportar roteamento Angular
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html; # SPA fallback, igual shell nginx.conf:9
    }

    # ADICIONADO: main.js estavel (gerado por scripts/postbuild.mjs) nunca cacheado + CORS
    # Shell aponta para http://localhost:4200/main.js (nao para main-ABC123.js)
    location = /main.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*"; # permite shell :3000 buscar cross-origin
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        expires 0;
    }

    # Chunks hasheados (main-*.js) com cache immutable 1y + CORS
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*"; # necessario para cross-origin da shell
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        access_log off;
    }

    location ~* /microfrontend\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
